name: Deploy V3.0 Stable to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-v3-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: api-restful-veterinaria
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  deploy-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required configuration
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "Configura la variable de repositorio TF_STATE_BUCKET"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init, format and validate
        working-directory: terraform
        run: |
          terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform fmt -recursive
          terraform validate

      - name: Create ECR repository
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.api \
            -target=aws_ecr_lifecycle_policy.api

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Stable image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: stable-${{ github.sha }}-${{ github.run_id }}
        run: |
          docker build --build-arg APP_VERSION=3.0.0 \
            -t "$REGISTRY/${PROJECT_NAME}-api:$IMAGE_TAG" .
          docker push "$REGISTRY/${PROJECT_NAME}-api:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Apply Stable infrastructure and deployment
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve \
            -var="image_tag=${IMAGE_TAG}" \
            -var="api_version=3.0.0"

      - name: Wait for Stable ECS service
        run: |
          aws ecs wait services-stable \
            --cluster "${PROJECT_NAME}-cluster" \
            --services "${PROJECT_NAME}-service"

      - name: Initialize PostgreSQL schema (idempotent)
        working-directory: terraform
        run: |
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SECURITY_GROUP=$(terraform output -raw ecs_security_group_id)
          TASK_DEFINITION=$(terraform output -raw ecs_task_definition_arn)
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","scripts/init-database.js"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          test -n "$TASK_ARN" && test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0" || { echo "Falló la inicialización PostgreSQL: $EXIT_CODE"; exit 1; }

      - name: Smoke test Stable
        working-directory: terraform
        run: |
          URL=$(terraform output -raw api_url)
          for attempt in $(seq 1 20); do
            if curl -fsS -D /tmp/headers "$URL/health" -o /tmp/body; then
              grep -qi '^X-App-Version: 3.0.0' /tmp/headers
              grep -qi '^X-App-Track: stable' /tmp/headers
              cat /tmp/body
              exit 0
            fi
            sleep 15
          done
          echo "Stable no respondió correctamente"; exit 1

      - name: Show Stable and Metrics URLs
        working-directory: terraform
        run: |
          echo "Stable API URL:"
          terraform output api_url
          echo "Grafana HTTPS metrics URL:"
          terraform output metrics_https_url
