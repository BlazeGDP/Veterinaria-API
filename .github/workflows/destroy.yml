name: Destroy V3 from AWS

# Elimina TODA la infraestructura creada por Terraform (VPC, NAT, ALB, ECS, RDS, ECR, Secrets, Logs).
# Se ejecuta SOLO a mano: Actions > "Destroy V3 from AWS" > Run workflow > escribir DESTROY.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DESTROY para confirmar la eliminación de la infraestructura'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-v3
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: api-restful-veterinaria

jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "TF_STATE_BUCKET=${PROJECT_NAME}-tf-state-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -input=false -auto-approve
