apiVersion: apps/v1
kind: Deployment
metadata:
  name: veterinaria-api
  labels:
    app: veterinaria-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: veterinaria-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: veterinaria-api

    spec:
      serviceAccountName: veterinaria-api-sqs

      containers:
        - name: veterinaria-api

          image: 634197800511.dkr.ecr.us-east-2.amazonaws.com/veterinaria-api:v2

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: veterinaria-api-config

            - secretRef:
                name: veterinaria-api-secret

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: veterinaria-api