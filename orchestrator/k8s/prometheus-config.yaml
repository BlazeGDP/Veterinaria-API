apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

      external_labels:
        environment: "veterinaria"
        cluster: "veterinaria-eks"

    scrape_configs:

      - job_name: "orchestrator"
        metrics_path: /orchestrator/metrics
        static_configs:
          - targets:
              - "veterinaria-orchestrator:80"

      - job_name: "aws-api"
        metrics_path: /orchestrator/metrics/aws
        static_configs:
          - targets:
              - "veterinaria-orchestrator:80"

      - job_name: "gcp-api"
        metrics_path: /orchestrator/metrics/gcp
        static_configs:
          - targets:
              - "veterinaria-orchestrator:80"

      - job_name: "azure-api"
        metrics_path: /orchestrator/metrics/azure
        static_configs:
          - targets:
              - "veterinaria-orchestrator:80"

    remote_write:
      - url: "https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push"

        basic_auth:
          username_file: "/etc/prometheus/secrets/username"
          password_file: "/etc/prometheus/secrets/password"