apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus

          image: prom/prometheus:latest

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"

          ports:
            - containerPort: 9090

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus

            - name: grafana-secret
              mountPath: /etc/prometheus/secrets
              readOnly: true

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: grafana-secret
          secret:
            secretName: grafana-cloud